<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>furniture single product page</title>
  </head>
  <body>
    <header class="container">
      <a href="./index.html">
        <img src="./images/logo.svg" alt="logo" />
      </a>
      <nav class="header-nav">
        <ul class="nav-list">
          <li><a href="./index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./shop.html">Shop</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
        <div class="nav-icons">
          <div class="cart-icon">
            <img src="./images/cart-icon.svg" alt="cart-icon" />
          </div>
          <div class="user-icon">
            <img src="./images/user-icon.svg" alt="user-icon" />
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero container">
        <div class="product-images">
          <div class="hero-gallery">
            <ul class="gallery-list">
              <li>
                <img src="./images/product-img-5.png" alt="Product Image 5" />
              </li>
              <li>
                <img src="./images/product-img-5.png" alt="Product Image 5" />
              </li>
              <li>
                <img src="./images/product-img-5.png" alt="Product Image 5" />
              </li>
              <li>
                <img src="./images/product-img-5.png" alt="Product Image 5" />
              </li>
              <li>
                <img src="./images/product-img-5.png" alt="Product Image 5" />
              </li>
            </ul>
          </div>
          <div class="main-image">
            <img src="./images/product-img.png" alt="sofa Image 1" />
          </div>
        </div>
        <div class="hero-description">
            <div class="product-name">
              <h1>Areni 57.1'' Upholstered Loveseat</h1>
            </div>
          <div class="product-rating">
            <div class="stars">
              <img src="./images/star-yellow.svg" alt="yellow-star-icon" />
              <img src="./images/star-yellow.svg" alt="yellow-star-icon" />
              <img src="./images/star-yellow.svg" alt="yellow-star-icon" />
              <img src="./images/star-yellow.svg" alt="yellow-star-icon" />
              <img src="./images/star-blank.svg" alt="blank-star-icon" />
            </div>
            <div class="rating-count">
            <p>3,345</p>
        </div>
          </div>
          <div class="price">
          <h2>$549.99</h2></div>
          <div class="product-colours">
          <div class="colours">
          <h3>Colors</h3></div>
          <div class="colour-options">
            <img src="./images/color-1.png" alt="Color 1" />
            <img src="./images/color-2.png" alt="Color 2" />
          </div>
        </div>
          <div class="add-to-cart-heart">
            <button class="add-to-cart-btn">Add to Cart</button>
            <div class="heart-icon">
            <img src="./images/heart-icon.svg" /></div>
          </div>
          <div class="buy-now-btn-div">
            <button class="buy-now-btn">Buy Now</button>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
